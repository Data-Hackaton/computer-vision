[project]
name = "computer-vision"
version = "0.1.0"
description = "CV-пайплайн (видео → timeline.json) и слой decision (правила → нарушения)"
authors = [
    { name = "Nik", email = "byluginnikita@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.114",
    "redis==8.1.0",
    "rfdetr[loggers,train]==1.11.2",
    "supervision==0.31.0",
    "temporalio==1.34.0",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.20.1",
    "ultralytics==8.4.178",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["cv", "decision"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
